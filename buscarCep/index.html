<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de CEP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="container">
        <section id="img">
            <img src="assents/undraw_map-dark_g9xq.svg" alt="">
        </section>
        <section id="formulario">
            <h1>Buscador de CEP</h1>
            <form id="Form">
                <label for="cep">Digite o CEP:</label>
                <input type="text" id="cep" name="cep" maxlength="9" placeholder="01001-000" required>
                <button type="submit">Buscar</button>
            </form>
       
        <div id="info">
            <p><span id="resultado"></span></p>
            <p>Rua: <span id="rua"></span></p>
            <p>Bairro: <span id="bairro"></span></p>
            <p>Cidade: <span id="cidade"></span></p>
            <p>UF: <span id="uf"></span></p>
        </div>
         </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
